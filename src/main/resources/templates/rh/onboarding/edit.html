<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{rh/layout/base}"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Onboarding</title>
</head>
<body>
    <th:block layout:fragment="breadcrumb">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/rh}"><i class="bi bi-house-door"></i> Accueil</a></li>
                <li class="breadcrumb-item"><a th:href="@{/rh/onboarding}"><i class="bi bi-box-arrow-in-right"></i> Onboarding</a></li>
                <li class="breadcrumb-item"><a th:href="@{/rh/onboarding/{uuid}(uuid=${onboarding.uuid})}">Détails</a></li>
                <li class="breadcrumb-item active">Modifier</li>
            </ol>
        </nav>
    </th:block>
    
    <th:block layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 mb-1"><i class="bi bi-pencil text-primary"></i> Modifier l'Onboarding</h1>
                        <p class="text-muted mb-0" th:text="${onboarding.employeNom}">Employé</p>
                    </div>
                    <div>
                        <a th:href="@{/rh/onboarding/{uuid}(uuid=${onboarding.uuid})}" class="btn btn-outline-secondary me-2">
                            <i class="bi bi-eye"></i> Voir
                        </a>
                        <a th:href="@{/rh/onboarding}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Retour
                        </a>
                    </div>
                </div>
                
                <form th:action="@{/rh/onboarding/{uuid}(uuid=${onboarding.uuid})}" th:object="${onboarding}" method="post" novalidate>
                    <input type="hidden" name="_method" value="PUT" th:if="${_csrf != null}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                    
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle"></i> Informations Générales</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Employé</label>
                                    <input type="text" class="form-control" th:value="${onboarding.employeNom}" disabled>
                                    <input type="hidden" th:field="*{employeId}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateDebut" class="form-label">Date début</label>
                                    <input type="date" class="form-control" id="dateDebut" th:field="*{dateDebut}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="statutOnboarding" class="form-label">Statut</label>
                                    <select class="form-select" id="statutOnboarding" th:field="*{statutOnboarding}">
                                        <option value="NON_DEMARRE">Non démarré</option>
                                        <option value="EN_COURS">En cours</option>
                                        <option value="COMPLETE">Complété</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="progression" class="form-label">Progression (%)</label>
                                    <input type="number" class="form-control" id="progression" th:field="*{progression}" min="0" max="100">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/rh/onboarding/{uuid}(uuid=${onboarding.uuid})}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Mettre à jour
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
