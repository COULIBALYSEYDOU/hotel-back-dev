<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{rh/layout/base}"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des Recrutements</title>
</head>
<body>
    <th:block layout:fragment="breadcrumb">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/rh}"><i class="bi bi-house-door"></i> Accueil</a></li>
                <li class="breadcrumb-item active"><i class="bi bi-person-badge"></i> Recrutements</li>
            </ol>
        </nav>
    </th:block>
    
    <th:block layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1"><i class="bi bi-person-badge text-primary"></i> Liste des Recrutements</h1>
                <p class="text-muted mb-0" th:if="${recrutements != null}">
                    <span th:text="${recrutements.totalElements}">0</span> recrutement(s) au total
                </p>
            </div>
            <div>
                <a th:href="@{/rh/recrutements/new}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouveau recrutement
                </a>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/rh/recrutements}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label for="search" class="form-label small">Rechercher</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="search" name="search" th:value="${param.search}" placeholder="Poste, candidat...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="statut" class="form-label small">Statut</label>
                        <select class="form-select" id="statut" name="statut">
                            <option value="">Tous</option>
                            <option value="OUVERT" th:selected="${param.statut == 'OUVERT'}">Ouvert</option>
                            <option value="EN_COURS" th:selected="${param.statut == 'EN_COURS'}">En cours</option>
                            <option value="CLOS" th:selected="${param.statut == 'CLOS'}">Clos</option>
                            <option value="ANNULE" th:selected="${param.statut == 'ANNULE'}">Annulé</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100 me-2">
                            <i class="bi bi-search"></i> Filtrer
                        </button>
                        <a th:href="@{/rh/recrutements}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-header bg-white border-bottom">
                <h5 class="mb-0"><i class="bi bi-list-ul"></i> Résultats</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Poste</th>
                                <th>Département</th>
                                <th>Statut</th>
                                <th>Date publication</th>
                                <th>Candidats</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="recrutement : ${recrutements.content}">
                                <td th:text="${recrutement.poste}">Poste</td>
                                <td th:text="${recrutement.departement != null ? recrutement.departement : '-'}">-</td>
                                <td>
                                    <span class="badge bg-success" th:if="${recrutement.statut == 'OUVERT'}">Ouvert</span>
                                    <span class="badge bg-primary" th:if="${recrutement.statut == 'EN_COURS'}">En cours</span>
                                    <span class="badge bg-secondary" th:if="${recrutement.statut == 'CLOS'}">Clos</span>
                                    <span class="badge bg-danger" th:if="${recrutement.statut == 'ANNULE'}">Annulé</span>
                                </td>
                                <td th:text="${recrutement.datePublication != null ? #temporals.format(recrutement.datePublication, 'dd/MM/yyyy') : '-'}">-</td>
                                <td>
                                    <span class="badge bg-info" th:text="${recrutement.nombreCandidats != null ? recrutement.nombreCandidats : '0'}">0</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/rh/recrutements/{uuid}(uuid=${recrutement.uuid})}" class="btn btn-outline-primary">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/rh/recrutements/{uuid}/edit(uuid=${recrutement.uuid})}" class="btn btn-outline-warning">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button class="btn btn-outline-danger" onclick="confirmDelete('${recrutement.uuid}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${recrutements == null or #lists.isEmpty(recrutements.content)}">
                                <td colspan="6" class="text-center py-5">
                                    <i class="bi bi-inbox fs-1 text-muted"></i>
                                    <p class="text-muted mt-3 mb-0">Aucun recrutement trouvé</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-top" th:if="${recrutements != null and recrutements.totalPages > 1}">
                <div th:replace="~{rh/components/pagination :: pagination}"></div>
            </div>
        </div>
    </th:block>
    
    <th:block layout:fragment="customJs">
        <script>
            function confirmDelete(uuid) {
                if (confirm('Êtes-vous sûr de vouloir supprimer ce recrutement ?')) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/rh/recrutements/' + uuid;
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = '_method';
                    input.value = 'DELETE';
                    form.appendChild(input);
                    document.body.appendChild(form);
                    form.submit();
                }
            }
        </script>
    </th:block>
</body>
</html>
