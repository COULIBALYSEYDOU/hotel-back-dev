<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{rh/layout/base}"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Compétence</title>
</head>
<body>
    <th:block layout:fragment="breadcrumb">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/rh}"><i class="bi bi-house-door"></i> Accueil</a></li>
                <li class="breadcrumb-item"><a th:href="@{/rh/competences}"><i class="bi bi-award"></i> Compétences</a></li>
                <li class="breadcrumb-item"><a th:href="@{/rh/competences/{uuid}(uuid=${competence.uuid})}">Détails</a></li>
                <li class="breadcrumb-item active">Modifier</li>
            </ol>
        </nav>
    </th:block>
    
    <th:block layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 mb-1"><i class="bi bi-pencil text-primary"></i> Modifier la Compétence</h1>
                        <p class="text-muted mb-0" th:text="${competence.nomCompetence}">Compétence</p>
                    </div>
                    <div>
                        <a th:href="@{/rh/competences/{uuid}(uuid=${competence.uuid})}" class="btn btn-outline-secondary me-2">
                            <i class="bi bi-eye"></i> Voir
                        </a>
                        <a th:href="@{/rh/competences}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Retour
                        </a>
                    </div>
                </div>
                
                <form th:action="@{/rh/competences/{uuid}(uuid=${competence.uuid})}" th:object="${competence}" method="post" novalidate>
                    <input type="hidden" name="_method" value="PUT" th:if="${_csrf != null}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                    
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle"></i> Informations Générales</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Employé</label>
                                    <input type="text" class="form-control" th:value="${competence.employeNom}" disabled>
                                    <input type="hidden" th:field="*{employeId}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="nomCompetence" class="form-label">Compétence</label>
                                    <input type="text" class="form-control" id="nomCompetence" th:field="*{nomCompetence}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="niveau" class="form-label">Niveau</label>
                                    <input type="text" class="form-control" id="niveau" th:field="*{niveau}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateObtention" class="form-label">Date obtention</label>
                                    <input type="date" class="form-control" id="dateObtention" th:field="*{dateObtention}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateExpiration" class="form-label">Date expiration</label>
                                    <input type="date" class="form-control" id="dateExpiration" th:field="*{dateExpiration}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" id="certifie" th:field="*{certifie}">
                                        <label class="form-check-label" for="certifie">Certifié</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/rh/competences/{uuid}(uuid=${competence.uuid})}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Mettre à jour
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
