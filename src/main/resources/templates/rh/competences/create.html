<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{rh/layout/base}"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle Compétence</title>
</head>
<body>
    <th:block layout:fragment="breadcrumb">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/rh}"><i class="bi bi-house-door"></i> Accueil</a></li>
                <li class="breadcrumb-item"><a th:href="@{/rh/competences}"><i class="bi bi-award"></i> Compétences</a></li>
                <li class="breadcrumb-item active">Nouvelle</li>
            </ol>
        </nav>
    </th:block>
    
    <th:block layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 mb-1"><i class="bi bi-award text-primary"></i> Nouvelle Compétence</h1>
                        <p class="text-muted mb-0">Remplissez le formulaire pour créer une nouvelle compétence</p>
                    </div>
                    <a th:href="@{/rh/competences}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                </div>
                
                <form th:action="@{/rh/competences}" th:object="${competence}" method="post" novalidate>
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle"></i> Informations Générales</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="employeId" class="form-label">Employé <span class="text-danger">*</span></label>
                                    <select class="form-select" id="employeId" th:field="*{employeId}" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="emp : ${employes}" th:value="${emp.id}" th:text="${emp.nom + ' ' + emp.prenom}">Employé</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="nomCompetence" class="form-label">Compétence <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nomCompetence" th:field="*{nomCompetence}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="niveau" class="form-label">Niveau</label>
                                    <input type="text" class="form-control" id="niveau" th:field="*{niveau}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateObtention" class="form-label">Date obtention</label>
                                    <input type="date" class="form-control" id="dateObtention" th:field="*{dateObtention}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateExpiration" class="form-label">Date expiration</label>
                                    <input type="date" class="form-control" id="dateExpiration" th:field="*{dateExpiration}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" id="certifie" th:field="*{certifie}">
                                        <label class="form-check-label" for="certifie">Certifié</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/rh/competences}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Créer
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
