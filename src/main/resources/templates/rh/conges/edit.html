<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{rh/layout/base}"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="${conge.employeNom + ' - Modifier congé'}">Modifier Congé</title>
    
    <th:block layout:fragment="customCss">
        <style>
            .required-field::after {
                content: " *";
                color: var(--danger);
            }
        </style>
    </th:block>
</head>
<body>
    <th:block layout:fragment="breadcrumb">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                    <a th:href="@{/rh}">
                        <i class="bi bi-house-door"></i> Accueil
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a th:href="@{/rh/conges}">
                        <i class="bi bi-calendar-check"></i> Congés
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a th:href="@{/rh/conges/{uuid}(uuid=${conge.uuid})}">
                        Détails
                    </a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    Modifier
                </li>
            </ol>
        </nav>
    </th:block>
    
    <th:block layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 mb-1">
                            <i class="bi bi-pencil text-primary"></i> Modifier le congé
                        </h1>
                        <p class="text-muted mb-0" th:text="'Modification du congé de ' + ${conge.employeNom}">Modification</p>
                    </div>
                    <div>
                        <a th:href="@{/rh/conges/{uuid}(uuid=${conge.uuid})}" class="btn btn-outline-secondary me-2">
                            <i class="bi bi-eye"></i> Voir
                        </a>
                        <a th:href="@{/rh/conges}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Retour
                        </a>
                    </div>
                </div>
                
                <!-- Alert si le congé ne peut pas être modifié -->
                <div class="alert alert-warning" th:if="${!conge.peutEtreModifie()}">
                    <i class="bi bi-exclamation-triangle"></i> 
                    Ce congé ne peut plus être modifié car il est déjà approuvé ou terminé.
                </div>
                
                <!-- Formulaire -->
                <form th:action="@{/rh/conges/{uuid}(uuid=${conge.uuid})}" 
                      th:object="${conge}" 
                      method="post" 
                      novalidate
                      id="editCongeForm">
                    
                    <!-- Token CSRF et méthode PUT -->
                    <input type="hidden" name="_method" value="PUT" th:if="${_csrf != null}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                    
                    <!-- Informations générales -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle"></i> Informations Générales</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="employeId" class="form-label required-field">Employé</label>
                                    <input type="text" 
                                           class="form-control" 
                                           th:value="${conge.employeNom != null ? conge.employeNom : 'N/A'}"
                                           disabled>
                                    <input type="hidden" th:field="*{employeId}">
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="typeConge" class="form-label required-field">Type de congé</label>
                                    <select class="form-select" 
                                            th:classappend="${#fields.hasErrors('typeConge')} ? 'is-invalid' : ''"
                                            id="typeConge" 
                                            th:field="*{typeConge}" 
                                            required>
                                        <option value="">-- Sélectionner --</option>
                                        <option value="ANNUEL">Annuel</option>
                                        <option value="MALADIE">Maladie</option>
                                        <option value="MATERNITE">Maternité</option>
                                        <option value="PATERNITE">Paternité</option>
                                        <option value="PARENTAL">Parental</option>
                                        <option value="SANS_SOLDE">Sans solde</option>
                                        <option value="RECUPERATION">Récupération</option>
                                        <option value="RTT">RTT</option>
                                        <option value="EXCEPTIONNEL">Exceptionnel</option>
                                        <option value="SABBATIQUE">Sabbatique</option>
                                        <option value="FORMATION">Formation</option>
                                        <option value="EVENEMENT_FAMILIAL">Événement familial</option>
                                        <option value="AUTRE">Autre</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('typeConge')}" 
                                         th:errors="*{typeConge}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="dateDebut" class="form-label required-field">Date de début</label>
                                    <input type="date" 
                                           class="form-control" 
                                           th:classappend="${#fields.hasErrors('dateDebut')} ? 'is-invalid' : ''"
                                           id="dateDebut" 
                                           th:field="*{dateDebut}" 
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dateDebut')}" 
                                         th:errors="*{dateDebut}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="dateFin" class="form-label required-field">Date de fin</label>
                                    <input type="date" 
                                           class="form-control" 
                                           th:classappend="${#fields.hasErrors('dateFin')} ? 'is-invalid' : ''"
                                           id="dateFin" 
                                           th:field="*{dateFin}" 
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dateFin')}" 
                                         th:errors="*{dateFin}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="natureConge" class="form-label">Nature du congé</label>
                                    <select class="form-select" id="natureConge" th:field="*{natureConge}">
                                        <option value="">-- Sélectionner --</option>
                                        <option value="PAYE">Payé</option>
                                        <option value="NON_PAYE">Non payé</option>
                                        <option value="PARTIELLEMENT_PAYE">Partiellement payé</option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input" 
                                               type="checkbox" 
                                               id="congéPartiel" 
                                               th:field="*{congéPartiel}">
                                        <label class="form-check-label" for="congéPartiel">
                                            Congé partiel
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label for="motif" class="form-label">Motif</label>
                                    <textarea class="form-control" 
                                              id="motif" 
                                              th:field="*{motif}" 
                                              rows="3"></textarea>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label for="justification" class="form-label">Justification</label>
                                    <textarea class="form-control" 
                                              id="justification" 
                                              th:field="*{justification}" 
                                              rows="3"></textarea>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="niveauUrgence" class="form-label">Niveau d'urgence</label>
                                    <select class="form-select" id="niveauUrgence" th:field="*{niveauUrgence}">
                                        <option value="NORMALE">Normale</option>
                                        <option value="ELEVEE">Élevée</option>
                                        <option value="URGENTE">Urgente</option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input" 
                                               type="checkbox" 
                                               id="urgenceMedicale" 
                                               th:field="*{urgenceMedicale}">
                                        <label class="form-check-label" for="urgenceMedicale">
                                            Urgence médicale
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Workflow (si en validation) -->
                    <div class="card shadow-sm mb-4" th:if="${conge.necessiteValidation()}">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-diagram-3"></i> Commentaires</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label for="commentairesEmploye" class="form-label">Commentaires employé</label>
                                    <textarea class="form-control" 
                                              id="commentairesEmploye" 
                                              th:field="*{commentairesEmploye}" 
                                              rows="3"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Documents -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-file-earmark"></i> Documents</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label for="documentsJustificatifs" class="form-label">Documents justificatifs (URLs séparées par des virgules)</label>
                                    <textarea class="form-control" 
                                              id="documentsJustificatifs" 
                                              th:field="*{documentsJustificatifs}" 
                                              rows="2"></textarea>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label for="certificatsMedicaux" class="form-label">Certificats médicaux (URLs séparées par des virgules)</label>
                                    <textarea class="form-control" 
                                              id="certificatsMedicaux" 
                                              th:field="*{certificatsMedicaux}" 
                                              rows="2"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Boutons d'action -->
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/rh/conges/{uuid}(uuid=${conge.uuid})}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary" th:disabled="${!conge.peutEtreModifie()}">
                                    <i class="bi bi-check-circle"></i> Mettre à jour
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
    
    <th:block layout:fragment="customJs">
        <script>
            // Validation Bootstrap
            (function () {
                'use strict'
                var forms = document.querySelectorAll('form[novalidate]')
                Array.prototype.slice.call(forms).forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
            })()
            
            // Validation des dates
            document.getElementById('dateDebut').addEventListener('change', function() {
                const dateDebut = new Date(this.value);
                const dateFin = document.getElementById('dateFin');
                if (dateFin.value) {
                    const dateFinValue = new Date(dateFin.value);
                    if (dateFinValue < dateDebut) {
                        dateFin.setCustomValidity('La date de fin doit être après la date de début');
                    } else {
                        dateFin.setCustomValidity('');
                    }
                }
            });
            
            document.getElementById('dateFin').addEventListener('change', function() {
                const dateDebut = document.getElementById('dateDebut');
                if (dateDebut.value) {
                    const dateDebutValue = new Date(dateDebut.value);
                    const dateFinValue = new Date(this.value);
                    if (dateFinValue < dateDebutValue) {
                        this.setCustomValidity('La date de fin doit être après la date de début');
                    } else {
                        this.setCustomValidity('');
                    }
                }
            });
        </script>
    </th:block>
</body>
</html>
