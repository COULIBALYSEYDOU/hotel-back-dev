<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{rh/layout/base}"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvel Horaire</title>
</head>
<body>
    <th:block layout:fragment="breadcrumb">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/rh}"><i class="bi bi-house-door"></i> Accueil</a></li>
                <li class="breadcrumb-item"><a th:href="@{/rh/horaires}"><i class="bi bi-clock"></i> Horaires</a></li>
                <li class="breadcrumb-item active">Nouveau</li>
            </ol>
        </nav>
    </th:block>
    
    <th:block layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 mb-1"><i class="bi bi-clock text-primary"></i> Nouvel Horaire</h1>
                        <p class="text-muted mb-0">Remplissez le formulaire pour créer un nouvel horaire</p>
                    </div>
                    <a th:href="@{/rh/horaires}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                </div>
                
                <form th:action="@{/rh/horaires}" th:object="${horaire}" method="post" novalidate>
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white">
                            <h5 class="mb-0"><i class="bi bi-info-circle"></i> Informations Générales</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="employeId" class="form-label">Employé <span class="text-danger">*</span></label>
                                    <select class="form-select" id="employeId" th:field="*{employeId}" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="emp : ${employes}" th:value="${emp.id}" th:text="${emp.nom + ' ' + emp.prenom}">Employé</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="date" class="form-label">Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="date" th:field="*{date}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="heureDebut" class="form-label">Heure début</label>
                                    <input type="time" class="form-control" id="heureDebut" th:field="*{heureDebut}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="heureFin" class="form-label">Heure fin</label>
                                    <input type="time" class="form-control" id="heureFin" th:field="*{heureFin}">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/rh/horaires}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Créer
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
