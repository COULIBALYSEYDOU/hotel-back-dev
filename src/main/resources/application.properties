# ============================================
# Configuration de l'application
# ============================================
spring.application.name=hotel
server.port=8098
server.servlet.context-path=/

# ============================================
# Configuration de la base de données PostgreSQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================
# Configuration JPA / Hibernate
# ============================================
# Dialecte PostgreSQL (nécessaire si connexion DB non disponible au démarrage)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Propriété Jakarta Persistence pour l'URL JDBC (requis pour déterminer le dialecte)
jakarta.persistence.jdbc.url=jdbc:postgresql://localhost:5432/hotel_db

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Validation JPA au démarrage
app.jpa.validation.enabled=true
app.database.healthcheck.enabled=true

# ============================================
# Configuration Thymeleaf
# ============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# ============================================
# Configuration de la sécurité — JWT + BCrypt
# ============================================
# Bascule en mode ouvert (dev uniquement) si true
app.security.permit-all=false

# Clé secrète JWT (Base64, HS256). À externaliser via la variable d'env JWT_SECRET en production.
app.jwt.secret=${JWT_SECRET:ZDkwZjM1NGE0ZWQ1ZDBmZjcxNGVjMTBmODVhZmY2MzMzYTM3ZTJhNzc4YjZmZjZmYjRjNmU3MTA5ZjM3NmYxNQ==}

# Durée de vie du token en ms (24h par défaut)
app.jwt.expiration-ms=86400000

# ============================================
# Configuration du logging
# ============================================
logging.level.root=INFO
logging.level.projet_hotelier.hotel=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# Configuration Jackson (JSON)
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ============================================
# Configuration SpringDoc OpenAPI (Swagger)
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================
# Configuration multipart (pour upload de fichiers)
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# Configuration de la gestion des erreurs
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================
# Configuration de la zone horaire
# ============================================
spring.jackson.time-zone=UTC

# ============================================
# Configuration du cache (optionnel)
# ============================================
spring.cache.type=none